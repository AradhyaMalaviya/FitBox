<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="mesh" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />
  <rect width="1280" height="720" fill="url(#mesh)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
  </g>

  <!-- Outer Border Glow -->
  <rect x="24" y="24" width="1232" height="672" rx="28" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none" />

  <!-- Decorative Anatomical Graphic on Right -->
  <g transform="translate(880, 200)" opacity="0.15" stroke="#f43f5e" stroke-width="3" fill="none">
    <circle cx="160" cy="160" r="140" stroke-dasharray="8 8" />
    <circle cx="160" cy="160" r="100" />
    <circle cx="160" cy="160" r="60" stroke-dasharray="4 4" />
    <path d="M160 20v280M20 160h280" stroke-width="1.5" />
    <path d="M4 12h16M12 4v16" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Brand & Category Header -->
  <g transform="translate(80, 80)">
    <!-- Muscle Group Pill -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="url(#accentGrad)" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="23" r="6" fill="#f43f5e" />
    <text x="44" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">CHEST</text>

    <!-- Equipment & Level Pill -->
    <rect x="236" y="0" width="180" height="46" rx="23" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="326" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">DIP BAR</text>

    <!-- Fitbox Badge -->
    <rect x="960" y="0" width="160" height="46" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="1040" y="28" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">FITBOX AI</text>
  </g>

  <!-- Exercise Title & Meta Info -->
  <g transform="translate(80, 420)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.5">Dips</text>
    <text x="0" y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" letter-spacing="4">PRECISION BIOMECHANICS &amp; MOVEMENT GUIDE</text>
    
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)" />
      <text x="55" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">INTERMEDIATE</text>
      
      <text x="130" y="21" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">HD VIDEO PREVIEW • FORM CUES • 1RM</text>
    </g>
  </g>

  <!-- Big Play Button Overlay Badge -->
  <g transform="translate(1080, 520)">
    <circle cx="60" cy="60" r="56" fill="url(#accentGrad)" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.5))" />
    <circle cx="60" cy="60" r="50" fill="#090d16" />
    <polygon points="52,42 76,60 52,78" fill="#FFFFFF" />
  </g>
</svg>